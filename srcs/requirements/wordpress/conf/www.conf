[www]
user = www-data
group = www-data

; Listen on all interfaces on port 9000, not just localhost - nginx is a
; separate container and needs to reach this over the Docker network
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no